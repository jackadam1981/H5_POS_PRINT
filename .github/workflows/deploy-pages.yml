name: Deploy Pages

on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        id: auth
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]]; then
            echo "Missing required GitHub Actions secret: CLOUDFLARE_API_TOKEN"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]]; then
            echo "Missing required GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.auth.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        if: steps.auth.outputs.should_deploy == 'true'
        run: npm ci

      - name: Build web assets
        if: steps.auth.outputs.should_deploy == 'true'
        run: npm run web:build

      - name: Resolve Pages deploy target
        if: steps.auth.outputs.should_deploy == 'true'
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          deploy_dir="${{ vars.CLOUDFLARE_PAGES_DEPLOY_DIR }}"
          if [[ -z "$deploy_dir" ]]; then
            for candidate in dist-web site public; do
              if [[ -d "$candidate" ]]; then
                deploy_dir="$candidate"
                break
              fi
            done
          fi

          if [[ -z "$deploy_dir" ]]; then
            echo "No Pages deploy directory found."
            echo "Set CLOUDFLARE_PAGES_DEPLOY_DIR or add one of: dist-web/, site/, public/."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=no Pages deploy directory found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          project_name="${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}"
          if [[ -z "$project_name" ]]; then
            project_name="h5-pos-print"
          fi

          branch_name="${GITHUB_REF_NAME}"
          if [[ "$branch_name" == "main" ]]; then
            deploy_branch="main"
          else
            deploy_branch="$(echo "$branch_name" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/^-+|-+$//g')"
            deploy_branch="${deploy_branch:0:40}"
            if [[ -z "$deploy_branch" ]]; then
              deploy_branch="preview"
            fi
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=$deploy_dir" >> "$GITHUB_OUTPUT"
          echo "project_name=$project_name" >> "$GITHUB_OUTPUT"
          echo "deploy_branch=$deploy_branch" >> "$GITHUB_OUTPUT"

      - name: Skip Pages deployment due to missing secrets
        if: steps.auth.outputs.should_deploy != 'true'
        run: echo "Skipping Pages deployment because required Cloudflare secrets are not configured."

      - name: Skip Pages deployment
        if: steps.auth.outputs.should_deploy == 'true' && steps.resolve.outputs.should_deploy != 'true'
        run: echo "Skipping Pages deployment: ${{ steps.resolve.outputs.skip_reason }}"

      - name: Print Pages deploy plan
        if: steps.auth.outputs.should_deploy == 'true' && steps.resolve.outputs.should_deploy == 'true'
        run: |
          echo "Cloudflare Pages project: ${{ steps.resolve.outputs.project_name }}"
          echo "Deploy directory: ${{ steps.resolve.outputs.deploy_dir }}"
          echo "Deploy branch: ${{ steps.resolve.outputs.deploy_branch }}"

      - name: Deploy Pages
        if: steps.auth.outputs.should_deploy == 'true' && steps.resolve.outputs.should_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler pages deploy ${{ steps.resolve.outputs.deploy_dir }}
          --project-name=${{ steps.resolve.outputs.project_name }}
          --branch=${{ steps.resolve.outputs.deploy_branch }}
