name: Deploy H5 (Cloudflare Workers)

on:
  push:
    branches:
      - "**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build H5
        run: npm run web:build

      - name: Compute worker name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          BASE="h5-pos-print"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$REF_NAME" == "main" ]]; then
            NAME="$BASE"
          else
            # Normalize branch name to a safe worker name suffix.
            # - lowercase
            # - replace non [a-z0-9-] with '-'
            # - trim to 40 chars
            SAFE="$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/^-+|-+$//g')"
            SAFE="${SAFE:0:40}"
            if [[ -z "$SAFE" ]]; then SAFE="branch"; fi
            NAME="$BASE-$SAFE"
          fi
          echo "worker_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying worker name: $NAME"

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy "worker/worker.ts" \
            --name "${{ steps.name.outputs.worker_name }}"

