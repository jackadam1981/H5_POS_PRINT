name: Deploy H5 (Cloudflare Workers + Pages)

on:
  push:
    branches:
      - "**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build H5
        run: npm run web:build

      - name: Upload dist-web
        uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist-web/

  deploy-workers:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Download dist-web
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist-web/

      - name: Compute worker name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          BASE="h5-pos-print"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$REF_NAME" == "main" ]]; then
            NAME="$BASE"
          else
            SAFE="$(echo "$REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g' | sed -E 's/^-+|-+$//g')"
            SAFE="${SAFE:0:40}"
            if [[ -z "$SAFE" ]]; then SAFE="branch"; fi
            NAME="$BASE-$SAFE"
          fi
          echo "worker_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploying Worker: $NAME"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name "${{ steps.name.outputs.worker_name }}"

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Download dist-web
        uses: actions/download-artifact@v4
        with:
          name: dist-web
          path: dist-web/

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${PAGES_PROJECT:-h5-pos-print}"
          REF_NAME="${GITHUB_REF_NAME}"
          if [[ "$REF_NAME" == "main" ]]; then
            echo "Pages production deploy → project=$PROJECT"
            npx wrangler pages deploy dist-web --project-name="$PROJECT"
          else
            echo "Pages preview deploy → project=$PROJECT branch=$REF_NAME"
            npx wrangler pages deploy dist-web --project-name="$PROJECT" --branch="$REF_NAME"
          fi
